  <text x="60" y="955" fill="#94a3b8" font-size="13">FamilyVault Safe Storage Engine • Vault ID: FV-REDDY-2026</text>
  <text x="60" y="980" fill="#94a3b8" font-size="13">“Your family documents. Safe, organized, always ready.”</text>
