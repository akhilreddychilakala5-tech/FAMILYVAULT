  <text x="60" y="315" fill="#64748b" font-size="16">Family Record Holder: <tspan fill="#0284c7" font-weight="bold">Rahul Reddy</tspan></text>
  
  <line x1="60" y1="345" x2="740" y2="345" stroke="#e2e8f0" stroke-width="2"/>

